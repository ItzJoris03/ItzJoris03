# Generates profile stats SVGs (stats + top languages) and commits them
# to output/stats/. Runs daily and on demand; the README loads the cards
# from raw.githubusercontent.com so there is no third-party dependency.
name: Generate Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: python3 .github/scripts/generate_stats.py

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/stats
          if git diff --cached --quiet; then
            echo "Cards unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh profile stats cards"
          git push
